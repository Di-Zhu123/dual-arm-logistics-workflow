[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-arm-logistics-workflow"
version = "0.1.0"
description = "Offline-first, approval-gated workflow for a three-camera dual-arm robot"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
vision = ["numpy>=1.23", "opencv-python>=4.8"]

[tool.setuptools.packages.find]
where = ["src"]
